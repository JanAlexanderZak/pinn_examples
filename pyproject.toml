[project]
name = "pinn-examples"
version = "0.1.0"
description = "Continuous-time and discrete-time physics-informed neural networks (PINNs) with PyTorch Lightning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1",
    "pytorch-lightning>=2.1",
    "torchmetrics>=1.3",
    "torcheval>=0.0.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyDOE>=0.3.8",
    "pillow>=10.2",
    "h5py>=3.10",
    "tensorboard>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
